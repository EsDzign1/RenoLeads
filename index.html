    <script>
      // Single Page Application redirect receiver for GitHub Pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
        // Normalize trailing slash for GitHub Pages repo subpath
        if (location.hostname.endsWith('github.io') && !location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
          location.replace(location.pathname + '/' + location.search + location.hash);
        }
      }(window.location));
    </script>
